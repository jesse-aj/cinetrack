<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="style.css"> 
    <title>CineTrack</title>
</head>
<body>
    <header class="site-header">
        <div class ="logo">CineTrack</div>
        <form class = "search-form" action="/search" method="GET">
            <input type="search" name="g" placeholder="Search for movies" aria-label="Seach">
            <button type = "submit"> Search </button> 
        </form>
        <nav class = "nav-links">
            <a href="library.html">My Library</a>
        </nav>
    </header>

<!--the hidden overlay container that covers the screen -->
<div id="movie-modal" class="modal-overlay">
    
<!-- The actual popup content box -->
<div class="modal-content">
        
<!--A close button so the user can exit from the modal page-->
<button id="close-modal-btn" class="close-btn">&times; Close</button>
       
<div id="modal-movie-details"></div>
<!--Javascript insert modal details here --> 
</div>
</div>

<div id="movie-grid" class="grid-container"> 
<!--JavaScript is inserted here (The cards)-->
</div>

<section>
    <h2>Tonight's Queue</h2>
<div id="tonights-queue" class="horizontal-container">

</div>
</section>

<form id="movie-form">
    <label for="title">Title of movie:</label>
    <input id="title" name="title" type="text" required>

    <label for="year">Year of movie:</label>
    <input id="year" name="year" type="number" required>

    <label for="genre">Genres:</label>
    <input
        id="genre"
        name="genre"
        type="text"
        placeholder="Sci-Fi, Drama"
        required
    >

    <label for="rating">Rating:</label>
    <input id="rating" name="rating" type="number" min="0" max="10" required>

    <label for="poster">Poster URL:</label>
    <input id="poster" name="poster" type="url">

    <button type="submit">Add movie</button>
</form>


<script src="app.js"></script>
</body>
</html>

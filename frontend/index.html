<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"  href="style.css"> 
    <title>CineTrack</title>
</head>
<body>
    <header class="site-header">
        <div class ="logo">CineTrack</div>
        <form class = "search-form" action="/search" method="GET">
            <input type="search" name="g" placeholder="Search for movies" aria-label="Seach">
            <button type = "submit"> Search </button> 
        </form>
        <nav class = "nav-links">
            <a href="library.html">My Library</a>
            <a href="#">About</a>
        </nav>
    </header>

<!--the hidden overlay container that covers the screen -->
<div id="movie-modal" class="modal-overlay">
    
<!-- The actual popup content box -->
<div class="modal-content">
        
<!--A close button so the user can exit from the modal page-->
<button id="close-modal-btn" class="close-btn">&times; Close</button>
       
<div id="modal-movie-details"></div>
<!--Javascript insert modal details here --> 
</div>
</div>

<div id="movie-grid" class="grid-container"> 
<!--JavaScript is inserted here (The cards)-->
</div>

<section>
    <h2>Tonight</h2>
<div id="tonights-queue" class="horizontal-container">

</div>
</section>

<form action="/your-upload-endpoint" method="POST" enctype="multipart/form-data">
  
  <label>Title of Movie: </label>
  <input type="text">
  <br></br>
  <label>Year of Movie: </label>
  <input type="text">
  <br></br>
  <label>Genre of Movie: </label>
  <select>
    <option>SCiFi</option>
    <option>Action</option>
    <option>Anime</option>
    <option>Drama</option>
  </select>
  <br></br>
  <label for="poster-upload">Choose the movie poster to upload: </label>
  <input type="file" name="poster">
  <br></br>
  <label for="video-upload">Choose the video to upload: </label>
  <input type="file" name="videoFile">
  <br></br>
  <label>I agree that this movie was not stolen</label>
  <input type="checkbox">
  <br><br>
  <button>Submit</button>
</form>


<script src="app.js"></script>
</body>
</html>
